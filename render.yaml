services:
  # ==============================================================================
  # 1. FastAPI Backend Web Service
  # ==============================================================================
  - type: web
    name: face-recognition-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: PYTHONPATH
        value: .
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000

  # ==============================================================================
  # 2. React + Vite Frontend Static Site
  # ==============================================================================
  - type: web
    name: face-recognition-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single-Page Application (SPA) rewrite rule: routes all paths to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: face-recognition-backend
          property: host
